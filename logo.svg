<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">PPTUI</title>
  <desc id="logo-desc">A deck of slides with a cursor, for the PPTUI deck format.</desc>

  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2536"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5e1f4"/>
    </linearGradient>
    <linearGradient id="title-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f80f5"/>
      <stop offset="1" stop-color="#8ccbff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="cursor-shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#badge)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glow)"/>
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- deck behind the front slide -->
  <g transform="translate(286 226) rotate(-14)">
    <rect x="-125" y="-70" width="250" height="140" rx="16" fill="#1f2a3d" stroke="#35435d" stroke-width="2"/>
  </g>
  <g transform="translate(274 236) rotate(-7)">
    <rect x="-134" y="-75" width="268" height="150" rx="17" fill="#26334a" stroke="#415477" stroke-width="2"/>
  </g>

  <!-- front slide (16:9) -->
  <g transform="translate(256 250)">
    <rect x="-144" y="-81" width="288" height="162" rx="20" fill="url(#card)" filter="url(#card-shadow)"/>

    <!-- title -->
    <rect x="-116" y="-52" width="124" height="16" rx="8" fill="url(#title-bar)"/>
    <rect x="-116" y="-26" width="82" height="10" rx="5" fill="#93a5c1"/>

    <!-- media placeholder -->
    <rect x="18" y="-54" width="104" height="96" rx="12" fill="#e9f0fb" stroke="#c8d6ec" stroke-width="1.5"/>
    <circle cx="44" cy="-32" r="7" fill="#4fd1a5"/>
    <path d="M26 34 L48 6 L62 24 L70 13 L100 34 Z" fill="#9db4d6"/>

    <!-- body lines -->
    <rect x="-116" y="6" width="118" height="9" rx="4.5" fill="#a9b9cf"/>
    <rect x="-116" y="26" width="92" height="9" rx="4.5" fill="#bcc9dc"/>
  </g>

  <!-- cursor -->
  <g transform="translate(400 328) rotate(12) scale(0.88)" filter="url(#cursor-shadow)">
    <path d="M0 0 L0 46 L12 35 L20 54 L31 49 L23 31 L39 29 Z" fill="#ff7ac6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
